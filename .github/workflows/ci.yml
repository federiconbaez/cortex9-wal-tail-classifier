---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: yamllint
        run: pipx run --spec yamllint==1.38.0 yamllint -s -c .yamllint.yml .github/workflows

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo test --release --all-targets

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - run: cargo build --locked --all-targets

  miri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Miri on format, recovery and prereg unit tests (the mmap control is FFI and not run under Miri)
        run: cargo miri test --lib
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  registered:
    name: registered run (shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Pre-registered 100k crashes, this shard; thresholds from prereg.toml
        run: ./target/release/wal-tail-classifier main --threads 4 --shard ${{ matrix.shard }}/4

  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Negative control, 10k fault-free trials must report nothing
        run: ./target/release/wal-tail-classifier negative --threads 4
      - name: Positive control, real mmap-wal-log must lose a corrupted last record
        run: ./target/release/wal-tail-classifier mmap-control
